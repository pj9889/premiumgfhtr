<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locanto Premium Access</title>
    <!-- Favicon -->
    <link rel="icon" href="yoxx.webp" type="image/webp">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Mobile Wrapper for PC and Mobile Display */
        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background-color: #0f0f0f;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px 15px 25px 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            border-radius: 20px;
            overflow: hidden;
        }

        @media (max-width: 420px) {
            .phone-frame {
                height: 100dvh; /* Dynamic viewport height for mobile browsers */
                max-height: 100dvh;
                border-radius: 0;
                box-shadow: none;
                padding: 15px 15px 30px 15px; /* Added extra bottom padding to lift content above bottom bars */
            }
        }

        /* Background 5 Pictures Slideshow */
        .bg-slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .slide-img.active {
            opacity: 1;
        }

        /* Overlay to keep images clear */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 2;
        }

        /* Top Header (Logo & Powered By Text) */
        .header-container {
            position: relative;
            z-index: 3;
            width: 100%;
            text-align: center;
            margin-top: 5px;
        }

        .logo-container img {
            width: 100%;
            max-width: 160px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
        }

        .powered-text {
            font-size: 13px;
            font-weight: bold;
            margin-top: 3px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
        }

        /* Colored words */
        .lo-col { color: #0056b3; }   /* Deep Blue */
        .can-col { color: #ff8500; }  /* Orange */
        .to-col { color: #cc3700; }   /* Deep Orange */

        /* Main Content Area */
        .main-content-area {
            position: relative;
            z-index: 3;
            width: 100%;
            text-align: center;
            padding: 0 10px;
            margin: auto 0;
        }

        .text-content {
            font-size: 16px;
            line-height: 1.5;
            color: #ffffff;
            text-shadow: 1px 2px 6px rgba(0, 0, 0, 0.95);
            font-weight: 500;
        }

        /* Buttons & Footer Container */
        .bottom-section {
            position: relative;
            z-index: 3;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 5px;
        }

        .btn {
            background-color: #ff0055;
            color: #ffffff;
            border: none;
            padding: 13px 25px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            transition: transform 0.2s, background-color 0.2s;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 12px;
        }

        .btn:hover {
            background-color: #e0004c;
        }

        /* Subtle Shake / Wiggle Animation for Affiliate Button */
        .animated-btn {
            animation: subtleWiggle 2s infinite ease-in-out;
            background-color: #00e676;
            color: #000;
        }

        .animated-btn:hover {
            background-color: #00c853;
        }

        @keyframes subtleWiggle {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-3px); }
            20%, 40%, 60%, 80% { transform: translateX(3px); }
        }

        /* Footer */
        .footer {
            font-size: 11px;
            color: #cccccc;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            text-align: center;
        }

        /* Separate Full-Screen Loading Page */
        #loading-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0f0f0f;
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #loading-screen img {
            width: 80%;
            max-width: 220px;
            margin-bottom: 25px;
        }

            border: 4px solid rgba(255, 255, 255, 0.1);
